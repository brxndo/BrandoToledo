@if (toastService.toast(); as toast) {
	<div
		role="status"
		class="fixed top-4 right-4 left-4 z-50 flex items-center justify-between gap-3 rounded-md px-4 py-3 text-sm font-medium text-white shadow-lg sm:left-auto sm:max-w-sm"
		[class]="toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'"
	>
		<span>{{ toast.message }}</span>
		<button type="button" (click)="toastService.close()" class="text-xl leading-none hover:opacity-80" aria-label="Cerrar aviso">&times;</button>
	</div>
}
