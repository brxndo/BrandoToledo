@if (src() && !imageFailed()) {
	<img [src]="src()" [alt]="'Logo de ' + name()" (error)="imageFailed.set(true)" class="h-10 w-10 rounded-full object-cover" />
} @else {
	<span class="flex h-10 w-10 items-center justify-center rounded-full bg-g_bp text-xs font-semibold text-white">{{ initials() }}</span>
}
